<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta APK Download</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0d1117;
    color:white;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#8b949e;
    margin-bottom:30px;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    transition:.3s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:#58a6ff;
}

.left{
    display:flex;
    align-items:center;
}

.icon{
    font-size:42px;
    margin-right:15px;
}

.info h2{
    font-size:18px;
    margin-bottom:6px;
}

.info p{
    color:#8b949e;
    font-size:14px;
}

.download{
    background:#2ea043;
    color:white;
    padding:12px 22px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.download:hover{
    background:#238636;
}

.loading{
    text-align:center;
    color:#8b949e;
    margin-top:60px;
    font-size:18px;
}

.footer{
    margin-top:40px;
    text-align:center;
    color:#666;
    font-size:13px;
}

@media(max-width:700px){

.card{
    flex-direction:column;
    align-items:flex-start;
}

.download{
    width:100%;
    margin-top:15px;
    text-align:center;
}

}
</style>

</head>
<body>

<div class="container">

<h1>📦 Delta APK Download</h1>

<div class="subtitle">
Download versi terbaru langsung dari GitHub Release
</div>

<div id="list">

<div class="loading">
Mengambil daftar APK...
</div>

</div>

<div class="footer">
Powered by GitHub API
</div>

</div>

<script>

const owner="varlie9-spec";
const repo="Delta-lama";

fetch(`https://api.github.com/repos/${owner}/${repo}/releases/latest`)
.then(res=>res.json())
.then(data=>{

let html="";

data.assets.forEach(asset=>{

if(asset.name.toLowerCase().includes(".apk")){

const size=(asset.size/1024/1024).toFixed(2);

const date=new Date(asset.updated_at);

html+=`

<div class="card">

<div class="left">

<div class="icon">
📦
</div>

<div class="info">

<h2>${asset.name}</h2>

<p>

📏 ${size} MB

<br>

🕒 ${date.toLocaleString()}

</p>

</div>

</div>

<a class="download"
href="${asset.browser_download_url}">
Download
</a>

</div>

`;

}

});

if(html==""){
html="<div class='loading'>APK tidak ditemukan.</div>";
}

document.getElementById("list").innerHTML=html;

})
.catch(()=>{

document.getElementById("list").innerHTML="<div class='loading'>Gagal mengambil data dari GitHub.</div>";

});

</script>

</body>
</html>
