name: Update Download Page

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate HTML
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <title>Download APK</title>
          </head>
          <body>
          <h2>Download APK</h2>
          Halaman ini akan diperbarui otomatis.
          </body>
          </html>
          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Update index" || exit 0
          git push
